<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Chess Notebook media</title>
<link rel="stylesheet" href="../../styles.css">
<style>
	/* Obsidian's default dark theme, close enough for screenshots. */
	body.theme-dark {
		--background-primary: #1e1e1e;
		--background-secondary: #262626;
		--background-secondary-alt: #363636;
		--background-modifier-border: #363636;
		--background-modifier-hover: rgba(255, 255, 255, 0.075);
		--text-normal: #dadada;
		--text-muted: #b3b3b3;
		--text-faint: #666666;
		--text-accent: #a68af9;
		--text-error: #fb464c;
		--text-on-accent: #ffffff;
		--interactive-accent: #7f6df2;
		--interactive-accent-hover: #8875ff;
		--font-text: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
		--font-monospace: "SF Mono", Menlo, Consolas, monospace;
	}
	body.theme-light {
		--background-primary: #ffffff;
		--background-secondary: #f6f6f6;
		--background-secondary-alt: #e3e3e3;
		--background-modifier-border: #e3e3e3;
		--background-modifier-hover: rgba(0, 0, 0, 0.075);
		--text-normal: #222222;
		--text-muted: #5c5c5c;
		--text-faint: #ababab;
		--text-accent: #8a5cf5;
		--text-error: #e93147;
		--text-on-accent: #ffffff;
		--interactive-accent: #8a5cf5;
		--interactive-accent-hover: #9d74f7;
		--font-text: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
		--font-monospace: "SF Mono", Menlo, Consolas, monospace;
	}
	html, body { margin: 0; }
	body {
		background: var(--background-primary);
		color: var(--text-normal);
		font-family: var(--font-text);
		font-size: 16px;
		line-height: 1.5;
	}
	.markdown-preview-view {
		max-width: 760px;
		margin: 0 auto;
		padding: 24px 32px 32px;
	}
	h1 { font-size: 1.9em; margin: 0 0 12px; }
	h2 { font-size: 1.45em; margin: 20px 0 8px; }
	p { margin: 8px 0; }
	code, pre { font-family: var(--font-monospace); }
	pre {
		background: var(--background-secondary);
		border-radius: 4px;
		padding: 10px 14px;
		font-size: 13px;
		white-space: pre-wrap;
	}
	.split { display: flex; gap: 0; height: 100vh; }
	.split > .pane { flex: 1; overflow: hidden; }
	.split > .pane + .pane { border-left: 1px solid var(--background-modifier-border); }
	.editor {
		padding: 24px 28px;
		font-family: var(--font-monospace);
		font-size: 14px;
		white-space: pre-wrap;
		color: var(--text-normal);
	}
	.editor .caret { border-left: 2px solid var(--interactive-accent); margin-left: -1px; animation: blink 1s step-end infinite; }
	@keyframes blink { 50% { border-color: transparent; } }
	.pane-title {
		font-size: 13px;
		color: var(--text-muted);
		padding: 8px 28px;
		border-bottom: 1px solid var(--background-modifier-border);
		background: var(--background-secondary);
	}
	/* Settings tab */
	.vertical-tab-content { padding: 8px 32px 24px; max-width: 760px; }
	.setting-item { display: flex; align-items: center; padding: 12px 0; border-top: 1px solid var(--background-modifier-border); gap: 16px; }
	.setting-item-heading { border-top: none; padding-top: 22px; }
	.setting-item-heading .setting-item-name { font-weight: 600; font-size: 1.05em; }
	.setting-item-info { flex: 1; }
	.setting-item-description { color: var(--text-muted); font-size: 0.85em; }
	.setting-item-control select, .setting-item-control input[type=text] {
		background: var(--background-secondary-alt); color: var(--text-normal);
		border: 1px solid var(--background-modifier-border); border-radius: 4px; padding: 4px 8px;
	}
	.setting-item-control input[type=range] { accent-color: var(--interactive-accent); width: 160px; }
	table { border-collapse: collapse; font-size: 0.9em; }
	th, td { border: 1px solid var(--background-modifier-border); padding: 4px 10px; text-align: left; }
</style>
</head>
<body class="theme-dark">
<div id="root"></div>
<script src="harness.js"></script>
</body>
</html>
